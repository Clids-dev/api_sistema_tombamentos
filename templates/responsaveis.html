{% extends "base.html" %}

{% block title %}Gestão de Responsáveis{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="fw-bold mb-0">Responsáveis</h2>
        <p class="text-muted">Gerencie as pessoas que respondem pelos setores e bens.</p>
    </div>
    <button class="btn btn-primary px-4 py-2 fw-bold" data-bs-toggle="modal" data-bs-target="#modalResponsavel">
        <i class="fas fa-plus me-2"></i> Novo Responsável
    </button>
</div>

<!-- Tabela de Responsáveis -->
<div class="card border-0 shadow-sm rounded-3">
    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead class="bg-light">
                <tr>
                    <th class="px-4 py-3 border-0">ID</th>
                    <th class="py-3 border-0">Nome Completo</th>
                    <th class="py-3 border-0">Cargo / Função</th>
                    <th class="py-3 border-0">Status</th>
                    <th class="px-4 py-3 border-0 text-end">Ações</th>
                </tr>
            </thead>
            <tbody id="listaResponsaveis">
                <!-- Preenchido via JS -->
            </tbody>
        </table>
    </div>
</div>

<!-- Modal Responsável -->
<div class="modal fade" id="modalResponsavel" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header border-bottom-0 p-4">
                <h5 class="modal-title fw-bold" id="tituloModal">Novo Responsável</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body px-4 pb-4">
                <form id="formResponsavel">
                    <input type="hidden" id="responsavelId">
                    <div class="mb-3">
                        <label for="nome" class="form-label fw-medium small text-muted">Nome Completo</label>
                        <input type="text" class="form-control" id="nome" required placeholder="Ex: João da Silva">
                    </div>
                    <div class="mb-3">
                        <label for="cargo" class="form-label fw-medium small text-muted">Cargo</label>
                        <input type="text" class="form-control" id="cargo" required placeholder="Ex: Gerente de TI">
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary py-2 fw-bold" id="btnSalvar">Salvar Responsável</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script type="module" src="/static/js/responsavel.js"></script>
{% endblock %}
