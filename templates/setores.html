{% extends "base.html" %}

{% block title %}Gestão de Setores{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="fw-bold mb-0">Setores</h2>
        <p class="text-muted">Gerencie os departamentos e locais físicos da organização.</p>
    </div>
    <button class="btn btn-primary px-4 py-2 fw-bold" data-bs-toggle="modal" data-bs-target="#modalSetor">
        <i class="fas fa-plus me-2"></i> Novo Setor
    </button>
</div>

<!-- Tabela de Setores -->
<div class="card border-0 shadow-sm rounded-3">
    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead class="bg-light">
                <tr>
                    <th class="px-4 py-3 border-0">ID</th>
                    <th class="py-3 border-0">Nome do Setor</th>
                    <th class="py-3 border-0">Responsável Atual</th>
                    <th class="py-3 border-0">Status</th>
                    <th class="px-4 py-3 border-0 text-end">Ações</th>
                </tr>
            </thead>
            <tbody id="listaSetores">
                <!-- Preenchido via JS -->
            </tbody>
        </table>
    </div>
</div>

<!-- Modal Setor -->
<div class="modal fade" id="modalSetor" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header border-bottom-0 p-4">
                <h5 class="modal-title fw-bold" id="tituloModal">Novo Setor</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body px-4 pb-4">
                <form id="formSetor">
                    <input type="hidden" id="setorId">
                    <div class="mb-3">
                        <label for="nome" class="form-label fw-medium small text-muted">Nome do Setor</label>
                        <input type="text" class="form-control" id="nome" required placeholder="Ex: Financeiro, TI">
                    </div>
                    <div class="mb-3">
                        <label for="responsavel_id" class="form-label fw-medium small text-muted">Responsável</label>
                        <select class="form-select" id="responsavel_id" required>
                            <option value="">Selecione um responsável...</option>
                            <!-- Preenchido via JS -->
                        </select>
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary py-2 fw-bold" id="btnSalvar">Salvar Setor</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script type="module" src="/static/js/setor.js"></script>
{% endblock %}
